<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线工具集 - JSON解析 · Base64 · URL编码 v1.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #cccccc;
        }

        .tabs {
            display: flex;
            gap: 4px;
        }

        .tab {
            background: #3e3e42;
            color: #cccccc;
            border: none;
            padding: 8px 16px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .tab:hover {
            background: #4e4e52;
        }

        .tab.active {
            background: #0e639c;
            color: white;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button.danger {
            background: #a1260d;
        }

        button.danger:hover {
            background: #bc2c0f;
        }

        button.success {
            background: #007079;
        }

        button.success:hover {
            background: #008a94;
        }

        button.secondary {
            background: #3e3e42;
        }

        button.secondary:hover {
            background: #4e4e52;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #2d2d30;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            border-bottom: 1px solid #3e3e42;
        }

        .editor {
            flex: 1;
            position: relative;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            padding: 16px;
            resize: none;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output {
            flex: 1;
            overflow: auto;
            padding: 16px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        .error {
            color: #f48771;
            background: rgba(244, 135, 113, 0.1);
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #f48771;
        }

        .success {
            color: #4ec9b0;
            background: rgba(78, 201, 176, 0.1);
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #4ec9b0;
        }

        .json-tree {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-null {
            color: #569cd6;
        }

        .collapsible {
            cursor: pointer;
        }

        .collapsible:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .collapser {
            display: inline-block;
            width: 16px;
            text-align: center;
            color: #858585;
            user-select: none;
        }

        .collapsed .collapser-content {
            display: none;
        }

        .collapsed .ellipsis {
            display: inline;
        }

        .ellipsis {
            display: none;
            color: #858585;
        }

        .hidden {
            display: none;
        }

        .stats {
            font-size: 12px;
            color: #858585;
            margin-left: 12px;
        }

        .result-plain {
            white-space: pre-wrap;
            word-break: break-all;
            color: #d4d4d4;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .panel {
                border-right: none;
                border-bottom: 1px solid #3e3e42;
            }
            .panel:last-child {
                border-bottom: none;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .tabs {
                justify-content: center;
            }
            .toolbar {
                justify-content: center;
            }
        }

        .copy-success {
            background: #008a94 !important;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 10px 16px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>离线工具集 <span class="stats">v1.2 · 完全离线 · 无需网络</span></h1>
        <div class="tabs">
            <button class="tab active" data-tab="json">JSON 解析</button>
            <button class="tab" data-tab="base64">Base64</button>
            <button class="tab" data-tab="url">URL 编码</button>
        </div>
    </header>

    <!-- JSON 解析 Tab -->
    <div class="tab-content active" id="json-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入 JSON</div>
                <div class="editor">
                    <textarea id="json-input" placeholder="在此粘贴你的 JSON 数据..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">解析结果</div>
                <div id="json-output">
                    <div style="color: #858585; font-style: italic;">等待输入 JSON...</div>
                </div>
            </div>
        </div>
        <div class="toolbar" style="padding: 10px 20px; background: #252526; border-top: 1px solid #3e3e42;">
            <button id="json-format" class="success">格式化</button>
            <button id="json-compress">压缩</button>
            <button id="json-clear" class="danger">清空</button>
            <button id="json-copy">复制结果</button>
        </div>
    </div>

    <!-- Base64 Tab -->
    <div class="tab-content" id="base64-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入文本</div>
                <div class="editor">
                    <textarea id="base64-input" placeholder="在此输入要编码/解码的文本..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">输出结果</div>
                <div class="editor">
                    <textarea id="base64-output" placeholder="结果将显示在这里..." readonly></textarea>
                </div>
            </div>
        </div>
        <div class="action-buttons">
            <button id="base64-encode" class="success">编码 → Base64</button>
            <button id="base64-decode">解码 ← Base64</button>
            <button id="base64-swap">交换输入输出</button>
            <button id="base64-clear" class="danger">清空</button>
            <button id="base64-copy">复制结果</button>
        </div>
    </div>

    <!-- URL Tab -->
    <div class="tab-content" id="url-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入文本</div>
                <div class="editor">
                    <textarea id="url-input" placeholder="在此输入要编码/解码的URL..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">输出结果</div>
                <div class="editor">
                    <textarea id="url-output" placeholder="结果将显示在这里..." readonly></textarea>
                </div>
            </div>
        </div>
        <div class="action-buttons">
            <button id="url-encode" class="success">编码 → URL</button>
            <button id="url-decode">解码 ← URL</button>
            <button id="url-swap">交换输入输出</button>
            <button id="url-clear" class="danger">清空</button>
            <button id="url-copy">复制结果</button>
        </div>
    </div>

    <script>
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabName = this.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(tabName + '-tab').classList.add('active');
            });
        });

        // ===== JSON 功能 =====
        const jsonInput = document.getElementById('json-input');
        const jsonOutput = document.getElementById('json-output');
        const jsonFormatBtn = document.getElementById('json-format');
        const jsonCompressBtn = document.getElementById('json-compress');
        const jsonClearBtn = document.getElementById('json-clear');
        const jsonCopyBtn = document.getElementById('json-copy');

        let currentJson = null;

        function formatJSON() {
            const input = jsonInput.value.trim();
            if (!input) {
                jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentJson = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentJson = parsed;
                renderJSONTree(parsed);
            } catch (e) {
                jsonOutput.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentJson = null;
            }
        }

        function compressJSON() {
            const input = jsonInput.value.trim();
            if (!input) {
                jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentJson = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentJson = parsed;
                const compressed = JSON.stringify(parsed);
                jsonOutput.innerHTML = `<pre class="result-plain">${escapeHtml(compressed)}</pre>`;
            } catch (e) {
                jsonOutput.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentJson = null;
            }
        }

        function renderJSONTree(obj) {
            jsonOutput.innerHTML = '<div class="json-tree">' + renderValue(obj, 0) + '</div>';
            attachCollapseHandlers();
        }

        function renderValue(value, depth) {
            if (value === null) {
                return '<span class="json-null">null</span>';
            }
            if (typeof value === 'boolean') {
                return '<span class="json-boolean">' + value + '</span>';
            }
            if (typeof value === 'number') {
                return '<span class="json-number">' + value + '</span>';
            }
            if (typeof value === 'string') {
                return `<span class="json-string">"${escapeHtml(value)}"</span>`;
            }
            if (Array.isArray(value)) {
                return renderArray(value, depth);
            }
            return renderObject(value, depth);
        }

        function renderArray(arr, depth) {
            if (arr.length === 0) {
                return '[]';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible"><span class="collapser">▶</span>[<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < arr.length; i++) {
                html += indentNext + renderValue(arr[i], depth + 1);
                if (i < arr.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + ']</div></span>';
            return html;
        }

        function renderObject(obj, depth) {
            const keys = Object.keys(obj);
            if (keys.length === 0) {
                return '{}';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible"><span class="collapser">▶</span>{<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                html += indentNext + `<span class="json-key">"${escapeHtml(key)}"</span>: ` + renderValue(obj[key], depth + 1);
                if (i < keys.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + '}</div></span>';
            return html;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function attachCollapseHandlers() {
            document.querySelectorAll('.collapsible').forEach(coll => {
                coll.querySelector('.collapser').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const parent = this.closest('.collapsible');
                    parent.classList.toggle('collapsed');
                    this.textContent = parent.classList.contains('collapsed') ? '▼' : '▶';
                });
            });
        }

        function clearJSON() {
            jsonInput.value = '';
            jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">等待输入 JSON...</div>';
            currentJson = null;
        }

        function copyJSON() {
            if (!currentJson) {
                return;
            }
            const text = JSON.stringify(currentJson, null, 2);
            copyToClipboard(text, jsonCopyBtn);
        }

        jsonFormatBtn.addEventListener('click', formatJSON);
        jsonCompressBtn.addEventListener('click', compressJSON);
        jsonClearBtn.addEventListener('click', clearJSON);
        jsonCopyBtn.addEventListener('click', copyJSON);
        jsonInput.addEventListener('paste', function() {
            setTimeout(formatJSON, 100);
        });
        jsonInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                formatJSON();
            }
        });

        // ===== Base64 功能 =====
        const base64Input = document.getElementById('base64-input');
        const base64Output = document.getElementById('base64-output');
        const base64EncodeBtn = document.getElementById('base64-encode');
        const base64DecodeBtn = document.getElementById('base64-decode');
        const base64SwapBtn = document.getElementById('base64-swap');
        const base64ClearBtn = document.getElementById('base64-clear');
        const base64CopyBtn = document.getElementById('base64-copy');

        function base64Encode() {
            const input = base64Input.value;
            try {
                const encoded = btoa(encodeURIComponent(input));
                base64Output.value = encoded;
            } catch (e) {
                base64Output.value = '编码错误: ' + e.message;
            }
        }

        function base64Decode() {
            const input = base64Input.value.trim();
            try {
                const decoded = decodeURIComponent(atob(input));
                base64Output.value = decoded;
            } catch (e) {
                base64Output.value = '解码错误: 不是有效的 Base64\n\n' + e.message;
            }
        }

        function base64Swap() {
            const temp = base64Input.value;
            base64Input.value = base64Output.value;
            base64Output.value = temp;
        }

        function base64Clear() {
            base64Input.value = '';
            base64Output.value = '';
        }

        function base64Copy() {
            copyToClipboard(base64Output.value, base64CopyBtn);
        }

        base64EncodeBtn.addEventListener('click', base64Encode);
        base64DecodeBtn.addEventListener('click', base64Decode);
        base64SwapBtn.addEventListener('click', base64Swap);
        base64ClearBtn.addEventListener('click', base64Clear);
        base64CopyBtn.addEventListener('click', base64Copy);

        // ===== URL 功能 =====
        const urlInput = document.getElementById('url-input');
        const urlOutput = document.getElementById('url-output');
        const urlEncodeBtn = document.getElementById('url-encode');
        const urlDecodeBtn = document.getElementById('url-decode');
        const urlSwapBtn = document.getElementById('url-swap');
        const urlClearBtn = document.getElementById('url-clear');
        const urlCopyBtn = document.getElementById('url-copy');

        function urlEncode() {
            const input = urlInput.value;
            try {
                const encoded = encodeURIComponent(input);
                urlOutput.value = encoded;
            } catch (e) {
                urlOutput.value = '编码错误: ' + e.message;
            }
        }

        function urlDecode() {
            const input = urlInput.value.trim();
            try {
                const decoded = decodeURIComponent(input);
                urlOutput.value = decoded;
            } catch (e) {
                urlOutput.value = '解码错误: 不是有效的 URL 编码\n\n' + e.message;
            }
        }

        function urlSwap() {
            const temp = urlInput.value;
            urlInput.value = urlOutput.value;
            urlOutput.value = temp;
        }

        function urlClear() {
            urlInput.value = '';
            urlOutput.value = '';
        }

        function urlCopy() {
            copyToClipboard(urlOutput.value, urlCopyBtn);
        }

        urlEncodeBtn.addEventListener('click', urlEncode);
        urlDecodeBtn.addEventListener('click', urlDecode);
        urlSwapBtn.addEventListener('click', urlSwap);
        urlClearBtn.addEventListener('click', urlClear);
        urlCopyBtn.addEventListener('click', urlCopy);

        // ===== 通用工具函数 =====
        function copyToClipboard(text, button) {
            if (!text) {
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '已复制!';
                button.classList.add('copy-success');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copy-success');
                }, 1500);
            }).catch(() => {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                const originalText = button.textContent;
                button.textContent = '已复制!';
                button.classList.add('copy-success');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copy-success');
                }, 1500);
            });
        }
    </script>
</body>
</html>
