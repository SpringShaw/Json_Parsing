<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 解析器 - 离线版 v1.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #cccccc;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button.danger {
            background: #a1260d;
        }

        button.danger:hover {
            background: #bc2c0f;
        }

        button.success {
            background: #007079;
        }

        button.success:hover {
            background: #008a94;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #2d2d30;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            border-bottom: 1px solid #3e3e42;
        }

        .editor {
            flex: 1;
            position: relative;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            padding: 16px;
            resize: none;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output {
            flex: 1;
            overflow: auto;
            padding: 16px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #f48771;
            background: rgba(244, 135, 113, 0.1);
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #f48771;
        }

        .json-tree {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-null {
            color: #569cd6;
        }

        .collapsible {
            cursor: pointer;
        }

        .collapsible:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .collapser {
            display: inline-block;
            width: 16px;
            text-align: center;
            color: #858585;
            user-select: none;
        }

        .collapsed .collapser-content {
            display: none;
        }

        .collapsed .ellipsis {
            display: inline;
        }

        .ellipsis {
            display: none;
            color: #858585;
        }

        .hidden {
            display: none;
        }

        .stats {
            font-size: 12px;
            color: #858585;
            margin-left: 12px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .panel {
                border-right: none;
                border-bottom: 1px solid #3e3e42;
            }
            .panel:last-child {
                border-bottom: none;
            }
        }

        .copy-success {
            background: #008a94 !important;
        }
    </style>
</head>
<body>
    <header>
        <h1>JSON 解析器 <span class="stats">v1.0 · 离线版本 · 无需网络</span></h1>
        <div class="toolbar">
            <button id="formatBtn" class="success">格式化</button>
            <button id="compressBtn">压缩</button>
            <button id="clearBtn" class="danger">清空</button>
            <button id="copyBtn">复制结果</button>
        </div>
    </header>
    <div class="container">
        <div class="panel">
            <div class="panel-header">输入 JSON</div>
            <div class="editor">
                <textarea id="input" placeholder="在此粘贴你的 JSON 数据..."></textarea>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">解析结果</div>
            <div id="output">
                <div style="color: #858585; font-style: italic;">等待输入 JSON...</div>
            </div>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const formatBtn = document.getElementById('formatBtn');
        const compressBtn = document.getElementById('compressBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        let currentParsed = null;

        // 格式化JSON
        function formatJSON() {
            const input = inputEl.value.trim();
            if (!input) {
                outputEl.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentParsed = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentParsed = parsed;
                renderJSONTree(parsed);
            } catch (e) {
                outputEl.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentParsed = null;
            }
        }

        // 压缩JSON
        function compressJSON() {
            const input = inputEl.value.trim();
            if (!input) {
                outputEl.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentParsed = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentParsed = parsed;
                const compressed = JSON.stringify(parsed);
                outputEl.innerHTML = `<pre style="white-space: pre-wrap; word-break: break-all;">${escapeHtml(compressed)}</pre>`;
            } catch (e) {
                outputEl.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentParsed = null;
            }
        }

        // 渲染高亮的JSON树
        function renderJSONTree(obj) {
            outputEl.innerHTML = '<div class="json-tree">' + renderValue(obj, 0) + '</div>';
            attachCollapseHandlers();
        }

        function renderValue(value, depth) {
            if (value === null) {
                return '<span class="json-null">null</span>';
            }
            if (typeof value === 'boolean') {
                return '<span class="json-boolean">' + value + '</span>';
            }
            if (typeof value === 'number') {
                return '<span class="json-number">' + value + '</span>';
            }
            if (typeof value === 'string') {
                return '<span class="json-string">"${escapeHtml(value)}"</span>';
            }
            if (Array.isArray(value)) {
                return renderArray(value, depth);
            }
            return renderObject(value, depth);
        }

        function renderArray(arr, depth) {
            if (arr.length === 0) {
                return '[]';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible collapsed"><span class="collapser">▼</span>[<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < arr.length; i++) {
                html += indentNext + renderValue(arr[i], depth + 1);
                if (i < arr.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + ']</div></span>';
            return html;
        }

        function renderObject(obj, depth) {
            const keys = Object.keys(obj);
            if (keys.length === 0) {
                return '{}';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible collapsed"><span class="collapser">▼</span>{<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                html += indentNext + '<span class="json-key">"${escapeHtml(key)}"</span>: ' + renderValue(obj[key], depth + 1);
                if (i < keys.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + '}</div></span>';
            return html;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function attachCollapseHandlers() {
            document.querySelectorAll('.collapsible').forEach(coll => {
                coll.querySelector('.collapser').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const parent = this.closest('.collapsible');
                    parent.classList.toggle('collapsed');
                    this.textContent = parent.classList.contains('collapsed') ? '▼' : '▶';
                });
            });
        }

        // 清空
        function clearAll() {
            inputEl.value = '';
            outputEl.innerHTML = '<div style="color: #858585; font-style: italic;">等待输入 JSON...</div>';
            currentParsed = null;
        }

        // 复制结果
        function copyResult() {
            if (!currentParsed) {
                return;
            }
            const text = JSON.stringify(currentParsed, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                copyBtn.classList.add('copy-success');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copy-success');
                }, 1500);
            }).catch(() => {
                // 降级方案
                const temp = document.createElement('textarea');
                temp.value = JSON.stringify(currentParsed, null, 2);
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                copyBtn.classList.add('copy-success');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copy-success');
                }, 1500);
            });
        }

        // 事件绑定
        formatBtn.addEventListener('click', formatJSON);
        compressBtn.addEventListener('click', compressJSON);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyResult);

        // 自动格式化粘贴
        inputEl.addEventListener('paste', function() {
            setTimeout(formatJSON, 100);
        });

        // 支持键盘快捷键 Ctrl+Enter 格式化
        inputEl.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                formatJSON();
            }
        });
    </script>
</body>
</html>
