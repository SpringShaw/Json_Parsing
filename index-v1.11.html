<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线工具集 - JSON解析 · Base64 · URL编码 · 图片转Base64 · 二维码生成 v1.11</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252526;
            padding: 8px 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #cccccc;
            white-space: nowrap;
        }

        .stats {
            font-size: 11px;
            color: #858585;
            white-space: nowrap;
        }

        .function-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
            padding: 4px 12px;
            background: #424245;
            border-radius: 4px;
        }

        .selector-label {
            font-size: 13px;
            color: #ffffff;
            font-weight: 500;
        }

        select {
            background: #0e639c;
            color: #ffffff;
            border: 1px solid #1177bb;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            background: #1177bb;
            border-color: #0e639c;
        }

        .action-bar {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            flex-wrap: wrap;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 0 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button.danger {
            background: #a1260d;
        }

        button.danger:hover {
            background: #bc2c0f;
        }

        button.success {
            background: #007079;
        }

        button.success:hover {
            background: #008a94;
        }

        button.secondary {
            background: #3e3e42;
        }

        button.secondary:hover {
            background: #4e4e52;
        }

        input[type="file"] {
            display: none;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #2d2d30;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #cccccc;
            border-bottom: 1px solid #3e3e42;
        }

        .editor {
            flex: 1;
            position: relative;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            padding: 12px;
            resize: none;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output {
            flex: 1;
            overflow: auto;
            padding: 12px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .error {
            color: #f48771;
            background: rgba(244, 135, 113, 0.1);
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #f48771;
        }

        .success {
            color: #4ec9b0;
            background: rgba(78, 201, 176, 0.1);
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #4ec9b0;
        }

        .json-tree {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-null {
            color: #569cd6;
        }

        .collapsible {
            cursor: pointer;
        }

        .collapsible:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .collapser {
            display: inline-block;
            width: 16px;
            text-align: center;
            color: #858585;
            user-select: none;
        }

        .collapsed .collapser-content {
            display: none;
        }

        .collapsed .ellipsis {
            display: inline;
        }

        .ellipsis {
            display: none;
            color: #858585;
        }

        .hidden {
            display: none;
        }

        .result-plain {
            white-space: pre-wrap;
            word-break: break-all;
            color: #d4d4d4;
        }

        /* 图片预览样式 */
        .image-preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: auto;
            background: #2d2d30;
        }

        .image-preview-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
        }

        .image-preview-container .placeholder {
            color: #858585;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .panel {
                border-right: none;
                border-bottom: 1px solid #3e3e42;
            }
            .panel:last-child {
                border-bottom: none;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-right {
                justify-content: center;
            }
            .action-bar {
                justify-content: center;
            }
        }

        .copy-success {
            background: #008a94 !important;
        }

        /* 二维码生成样式 */
        .qrcode-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: auto;
            background: #2d2d30;
        }

        .qrcode-wrapper {
            text-align: center;
        }

        .qrcode-container canvas {
            background: white;
            padding: 10px;
            border-radius: 4px;
            max-width: 100%;
            height: auto;
        }

        .qrcode-container .placeholder {
            color: #858585;
            font-style: italic;
        }

        .qrcode-download {
            margin-top: 12px;
        }

        .qrcode-download a {
            color: #9cdcfe;
            font-size: 13px;
            text-decoration: none;
        }

        .qrcode-download a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>离线工具集 <span class="stats">v1.11 · 完全离线 · 无需网络</span></h1>
        <div class="function-selector">
            <label class="selector-label" for="function-select">功能入口：</label>
            <select id="function-select">
                <option value="json">JSON 解析</option>
                <option value="base64">Base64（文本）</option>
                <option value="image-base64">Base64（图片）</option>
                <option value="url">URL 编码解码</option>
                <option value="qrcode">二维码生成</option>
            </select>
        </div>
    </header>

    <div class="action-bar" id="action-bar">
        <!-- 动态根据当前功能显示对应按钮 -->
    </div>

    <!-- JSON 解析 -->
    <div class="tab-content active" id="json-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入 JSON</div>
                <div class="editor">
                    <textarea id="json-input" placeholder="在此粘贴你的 JSON 数据..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">解析结果</div>
                <div id="json-output">
                    <div style="color: #858585; font-style: italic;">等待输入 JSON...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文本 Base64 -->
    <div class="tab-content" id="base64-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入文本</div>
                <div class="editor">
                    <textarea id="base64-input" placeholder="在此输入要编码/解码的文本..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">输出结果</div>
                <div class="editor">
                    <textarea id="base64-output" placeholder="结果将显示在这里..." readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片 Base64 -->
    <div class="tab-content" id="image-base64-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">Base64 内容</div>
                <div class="editor">
                    <textarea id="image-base64" placeholder="图片的 Base64 内容会显示在这里，也可以粘贴 Base64 来预览图片"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">图片预览</div>
                <div class="image-preview-container" id="image-preview">
                    <div class="placeholder">请点击"选择图片"按钮上传图片，或粘贴 Base64 在左侧</div>
                </div>
            </div>
        </div>
    </div>

    <!-- URL 编码解码 -->
    <div class="tab-content" id="url-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入文本</div>
                <div class="editor">
                    <textarea id="url-input" placeholder="在此输入要编码/解码的URL..."></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">输出结果</div>
                <div class="editor">
                    <textarea id="url-output" placeholder="结果将显示在这里..." readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- 二维码生成 -->
    <div class="tab-content" id="qrcode-tab">
        <div class="container">
            <div class="panel">
                <div class="panel-header">输入内容</div>
                <div class="editor">
                    <textarea id="qrcode-input" placeholder="在此输入链接或文本，右侧将实时生成二维码...&#10;&#10;例如：https://www.example.com"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">二维码预览</div>
                <div class="qrcode-container" id="qrcode-preview">
                    <div class="placeholder">请在左侧输入内容，将实时生成二维码</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 按钮定义
        const buttonConfig = {
            json: [
                { id: 'json-format', text: '格式化', className: 'success' },
                { id: 'json-compress', text: '压缩', className: '' },
                { id: 'json-clear', text: '清空', className: 'danger' },
                { id: 'json-copy', text: '复制结果', className: '' }
            ],
            base64: [
                { id: 'base64-encode', text: '编码 → Base64', className: 'success' },
                { id: 'base64-decode', text: '解码 ← Base64', className: '' },
                { id: 'base64-swap', text: '交换输入输出', className: '' },
                { id: 'base64-clear', text: '清空', className: 'danger' },
                { id: 'base64-copy', text: '复制结果', className: '' }
            ],
            'image-base64': [
                { id: 'select-image', text: '选择图片', className: 'secondary' },
                { id: 'image-base64-copy', text: '复制 Base64', className: '' },
                { id: 'image-refresh', text: '刷新预览', className: '' },
                { id: 'image-clear', text: '清空', className: 'danger' }
            ],
            url: [
                { id: 'url-encode', text: '编码 → URL', className: 'success' },
                { id: 'url-decode', text: '解码 ← URL', className: '' },
                { id: 'url-swap', text: '交换输入输出', className: '' },
                { id: 'url-clear', text: '清空', className: 'danger' },
                { id: 'url-copy', text: '复制结果', className: '' }
            ],
            qrcode: [
                { id: 'qrcode-download', text: '下载二维码', className: 'success' },
                { id: 'qrcode-clear', text: '清空', className: 'danger' }
            ]
        };

        const functionSelect = document.getElementById('function-select');
        const actionBar = document.getElementById('action-bar');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        document.body.appendChild(fileInput);

        // 切换功能
        function switchFunction(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            updateActions(tabName);
        }

        // 下拉框变化
        functionSelect.addEventListener('change', function() {
            switchFunction(this.value);
        });

        // 更新按钮
        function updateActions(tabName) {
            actionBar.innerHTML = '';
            buttonConfig[tabName].forEach(btn => {
                const button = document.createElement('button');
                button.id = btn.id;
                button.className = btn.className;
                button.textContent = btn.text;
                actionBar.appendChild(button);
            });
            bindEvents();
        }

        // ===== JSON 功能 =====
        let jsonFormatBtn, jsonCompressBtn, jsonClearBtn, jsonCopyBtn;
        const jsonInput = document.getElementById('json-input');
        const jsonOutput = document.getElementById('json-output');
        let currentJson = null;

        function formatJSON() {
            const input = jsonInput.value.trim();
            if (!input) {
                jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentJson = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentJson = parsed;
                renderJSONTree(parsed);
            } catch (e) {
                jsonOutput.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentJson = null;
            }
        }

        function compressJSON() {
            const input = jsonInput.value.trim();
            if (!input) {
                jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">请输入 JSON 数据</div>';
                currentJson = null;
                return;
            }

            try {
                const parsed = JSON.parse(input);
                currentJson = parsed;
                const compressed = JSON.stringify(parsed);
                jsonOutput.innerHTML = `<pre class="result-plain">${escapeHtml(compressed)}</pre>`;
            } catch (e) {
                jsonOutput.innerHTML = `<div class="error"><strong>解析错误:</strong><br>${escapeHtml(e.message)}</div>`;
                currentJson = null;
            }
        }

        function renderJSONTree(obj) {
            jsonOutput.innerHTML = '<div class="json-tree">' + renderValue(obj, 0) + '</div>';
            attachCollapseHandlers();
        }

        function renderValue(value, depth) {
            if (value === null) {
                return '<span class="json-null">null</span>';
            }
            if (typeof value === 'boolean') {
                return '<span class="json-boolean">' + value + '</span>';
            }
            if (typeof value === 'number') {
                return '<span class="json-number">' + value + '</span>';
            }
            if (typeof value === 'string') {
                return `<span class="json-string">"${escapeHtml(value)}"</span>`;
            }
            if (Array.isArray(value)) {
                return renderArray(value, depth);
            }
            return renderObject(value, depth);
        }

        function renderArray(arr, depth) {
            if (arr.length === 0) {
                return '[]';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible"><span class="collapser">▶</span>[<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < arr.length; i++) {
                html += indentNext + renderValue(arr[i], depth + 1);
                if (i < arr.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + ']</div></span>';
            return html;
        }

        function renderObject(obj, depth) {
            const keys = Object.keys(obj);
            if (keys.length === 0) {
                return '{}';
            }
            const indent = '  '.repeat(depth);
            const indentNext = '  '.repeat(depth + 1);
            let html = '<span class="collapsible"><span class="collapser">▶</span>{<span class="ellipsis">...</span><div class="collapser-content">\n';
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                html += indentNext + `<span class="json-key">"${escapeHtml(key)}"</span>: ` + renderValue(obj[key], depth + 1);
                if (i < keys.length - 1) {
                    html += ',';
                }
                html += '\n';
            }
            html += indent + '}</div></span>';
            return html;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function attachCollapseHandlers() {
            document.querySelectorAll('.collapsible').forEach(coll => {
                coll.querySelector('.collapser').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const parent = this.closest('.collapsible');
                    parent.classList.toggle('collapsed');
                    this.textContent = parent.classList.contains('collapsed') ? '▼' : '▶';
                });
            });
        }

        function clearJSON() {
            jsonInput.value = '';
            jsonOutput.innerHTML = '<div style="color: #858585; font-style: italic;">等待输入 JSON...</div>';
            currentJson = null;
        }

        function copyJSON() {
            if (!currentJson) {
                return;
            }
            const text = JSON.stringify(currentJson, null, 2);
            copyToClipboard(text, document.getElementById('json-copy'));
        }

        // ===== Base64 文本功能 =====
        let base64EncodeBtn, base64DecodeBtn, base64SwapBtn, base64ClearBtn, base64CopyBtn;
        const base64Input = document.getElementById('base64-input');
        const base64Output = document.getElementById('base64-output');

        function base64Encode() {
            const input = base64Input.value;
            try {
                const encoded = btoa(encodeURIComponent(input));
                base64Output.value = encoded;
            } catch (e) {
                base64Output.value = '编码错误: ' + e.message;
            }
        }

        function base64Decode() {
            const input = base64Input.value.trim();
            try {
                const decoded = decodeURIComponent(atob(input));
                base64Output.value = decoded;
            } catch (e) {
                base64Output.value = '解码错误: 不是有效的 Base64\n\n' + e.message;
            }
        }

        function base64Swap() {
            const temp = base64Input.value;
            base64Input.value = base64Output.value;
            base64Output.value = temp;
        }

        function base64Clear() {
            base64Input.value = '';
            base64Output.value = '';
        }

        function base64Copy() {
            copyToClipboard(base64Output.value, document.getElementById('base64-copy'));
        }

        // ===== URL 功能 =====
        let urlEncodeBtn, urlDecodeBtn, urlSwapBtn, urlClearBtn, urlCopyBtn;
        const urlInput = document.getElementById('url-input');
        const urlOutput = document.getElementById('url-output');

        function urlEncode() {
            const input = urlInput.value;
            try {
                const encoded = encodeURIComponent(input);
                urlOutput.value = encoded;
            } catch (e) {
                urlOutput.value = '编码错误: ' + e.message;
            }
        }

        function urlDecode() {
            const input = urlInput.value.trim();
            try {
                const decoded = decodeURIComponent(input);
                urlOutput.value = decoded;
            } catch (e) {
                urlOutput.value = '解码错误: 不是有效的 URL 编码\n\n' + e.message;
            }
        }

        function urlSwap() {
            const temp = urlInput.value;
            urlInput.value = urlOutput.value;
            urlOutput.value = temp;
        }

        function urlClear() {
            urlInput.value = '';
            urlOutput.value = '';
        }

        function urlCopy() {
            copyToClipboard(urlOutput.value, document.getElementById('url-copy'));
        }

        // ===== 图片 Base64 功能 =====
        let selectImageBtn, imageBase64CopyBtn, imageRefreshBtn, imageClearBtn;
        const imageBase64El = document.getElementById('image-base64');
        const imagePreviewEl = document.getElementById('image-preview');
        let currentImageUrl = '';

        function selectImage() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) {
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                imageBase64El.value = base64;
                currentImageUrl = base64;
                renderPreview();
            };
            reader.readAsDataURL(file);
            // 清空fileInput，允许重复选同一个文件
            e.target.value = '';
        });

        function renderPreview() {
            const base64 = imageBase64El.value.trim();
            if (!base64) {
                imagePreviewEl.innerHTML = '<div class="placeholder">请点击"选择图片"按钮上传图片，或粘贴 Base64 在左侧</div>';
                currentImageUrl = '';
                return;
            }

            // 如果不带有data:image前缀，自动加上
            let fullUrl = base64;
            if (!base64.startsWith('data:')) {
                fullUrl = 'data:image/png;base64,' + base64;
            }

            currentImageUrl = fullUrl;
            imagePreviewEl.innerHTML = `<img src="${fullUrl}" alt="预览" />`;
        }

        function imageBase64Copy() {
            copyToClipboard(imageBase64El.value.trim(), document.getElementById('image-base64-copy'));
        }

        function imageClear() {
            imageBase64El.value = '';
            imagePreviewEl.innerHTML = '<div class="placeholder">请点击"选择图片"按钮上传图片，或粘贴 Base64 在左侧</div>';
            currentImageUrl = '';
        }

        // ===== 二维码生成功能 =====
        let qrcodeDownloadBtn, qrcodeClearBtn;
        const qrcodeInput = document.getElementById('qrcode-input');
        const qrcodePreview = document.getElementById('qrcode-preview');
        let currentQrCanvas = null;

        // QRCode 生成库 - 完整实现，包含纠错编码，完全离线
        // 基于 kjdev/qrcode 迷你实现
        (function() {
            var QRCode = function() {
                this.init.apply(this, arguments);
            };

            QRCode.prototype.init = function(text, correction) {
                this.text = text;
                this.correction = correction || 'L';
                this.make();

                for (var y = 0; y < size; y++) {
                    run = 0;
                    color = false;
                    for (var x = 0; x < size; x++) {
                        if (modules[x][y] == color) {
                            run++;
                        } else {
                            if (run >= 5) penalty += 3 + (run - 5);
                            run = 1;
                            color = !color;
                        }
                    }
                    if (run >= 5) penalty += 3 + (run - 5);
                }
                for (var x = 0; x < size; x++) {
                    run = 0;
                    color = false;
                    for (var y = 0; y < size; y++) {
                        if (modules[x][y] == color) {
                            run++;
                        } else {
                            if (run >= 5) penalty += 3 + (run - 5);
                            run = 1;
                            color = !color;
                        }
                    }
                    if (run >= 5) penalty += 3 + (run - 5);
                }
                for (var x = 0; x < size - 1; x++) {
                    for (var y = 0; y < size - 1; y++) {
                        if (modules[x][y] == modules[x + 1][y] &&
                            modules[x][y] == modules[x][y + 1] &&
                            modules[x][y] == modules[x + 1][y + 1]) {
                            penalty += 3;
                        }
                    }
                }
                var darkCount = 0;
                for (var x = 0; x < size; x++) {
                    for (var y = 0; y < size; y++) {
                        if (modules[x][y]) darkCount++;
                    }
                }
                var ratio = Math.abs(50 - darkCount * 100 / (size * size)) / 5;
                penalty += Math.floor(ratio) * 10;
                return penalty;
            };

            window.QRCode = QRCode;
        })();

        // 生成二维码
        function generateQRCode() {
            const text = qrcodeInput.value.trim();
            if (!text) {
                qrcodePreview.innerHTML = '<div class="placeholder">请在左侧输入内容，将实时生成二维码</div>';
                currentQrCanvas = null;
                return;
            }

            try {
                const qr = new QRCode(text);
                currentQrCanvas = qr.createCanvas(300);

                qrcodePreview.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.className = 'qrcode-wrapper';
                wrapper.appendChild(currentQrCanvas);

                if (currentQrCanvas) {
                    const downloadDiv = document.createElement('div');
                    downloadDiv.className = 'qrcode-download';
                    const downloadLink = document.createElement('a');
                    downloadLink.id = 'qrcode-download-link';
                    downloadLink.textContent = '点击下载图片';
                    downloadLink.href = currentQrCanvas.toDataURL('image/png');
                    downloadLink.download = 'qrcode.png';
                    downloadDiv.appendChild(downloadLink);
                    wrapper.appendChild(downloadDiv);
                }

                qrcodePreview.appendChild(wrapper);
            } catch (e) {
                qrcodePreview.innerHTML = `<div class="error"><strong>生成错误:</strong><br>${escapeHtml(e.message)}</div>`;
                console.error(e);
                currentQrCanvas = null;
            }
        }

        // 下载二维码
        function qrcodeDownload() {
            if (!currentQrCanvas) {
                return;
            }
            const link = document.getElementById('qrcode-download-link');
            if (link) {
                link.click();
            }
        }

        // 清空二维码
        function qrcodeClear() {
            qrcodeInput.value = '';
            qrcodePreview.innerHTML = '<div class="placeholder">请在左侧输入内容，将实时生成二维码</div>';
            currentQrCanvas = null;
        }

        // 绑定事件
        function bindEvents() {
            // JSON
            jsonFormatBtn = document.getElementById('json-format');
            jsonCompressBtn = document.getElementById('json-compress');
            jsonClearBtn = document.getElementById('json-clear');
            jsonCopyBtn = document.getElementById('json-copy');

            if (jsonFormatBtn) {
                jsonFormatBtn.addEventListener('click', formatJSON);
                jsonCompressBtn.addEventListener('click', compressJSON);
                jsonClearBtn.addEventListener('click', clearJSON);
                jsonCopyBtn.addEventListener('click', copyJSON);
            }

            // Base64
            base64EncodeBtn = document.getElementById('base64-encode');
            base64DecodeBtn = document.getElementById('base64-decode');
            base64SwapBtn = document.getElementById('base64-swap');
            base64ClearBtn = document.getElementById('base64-clear');
            base64CopyBtn = document.getElementById('base64-copy');

            if (base64EncodeBtn) {
                base64EncodeBtn.addEventListener('click', base64Encode);
                base64DecodeBtn.addEventListener('click', base64Decode);
                base64SwapBtn.addEventListener('click', base64Swap);
                base64ClearBtn.addEventListener('click', base64Clear);
                base64CopyBtn.addEventListener('click', base64Copy);
            }

            // URL
            urlEncodeBtn = document.getElementById('url-encode');
            urlDecodeBtn = document.getElementById('url-decode');
            urlSwapBtn = document.getElementById('url-swap');
            urlClearBtn = document.getElementById('url-clear');
            urlCopyBtn = document.getElementById('url-copy');

            if (urlEncodeBtn) {
                urlEncodeBtn.addEventListener('click', urlEncode);
                urlDecodeBtn.addEventListener('click', urlDecode);
                urlSwapBtn.addEventListener('click', urlSwap);
                urlClearBtn.addEventListener('click', urlClear);
                urlCopyBtn.addEventListener('click', urlCopy);
            }

            // Image
            selectImageBtn = document.getElementById('select-image');
            imageBase64CopyBtn = document.getElementById('image-base64-copy');
            imageRefreshBtn = document.getElementById('image-refresh');
            imageClearBtn = document.getElementById('image-clear');

            if (selectImageBtn) {
                selectImageBtn.addEventListener('click', selectImage);
                imageBase64CopyBtn.addEventListener('click', imageBase64Copy);
                imageRefreshBtn.addEventListener('click', renderPreview);
                imageClearBtn.addEventListener('click', imageClear);
            }

            // QRCode
            qrcodeDownloadBtn = document.getElementById('qrcode-download');
            qrcodeClearBtn = document.getElementById('qrcode-clear');

            if (qrcodeDownloadBtn) {
                qrcodeDownloadBtn.addEventListener('click', qrcodeDownload);
                qrcodeClearBtn.addEventListener('click', qrcodeClear);
            }
        }

        // 通用复制
        function copyToClipboard(text, button) {
            if (!text) {
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '已复制!';
                button.classList.add('copy-success');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copy-success');
                }, 1500);
            }).catch(() => {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                const originalText = button.textContent;
                button.textContent = '已复制!';
                button.classList.add('copy-success');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copy-success');
                }, 1500);
            });
        }

        // 自动格式化粘贴
        jsonInput.addEventListener('paste', function() {
            setTimeout(formatJSON, 100);
        });

        // 支持键盘快捷键 Ctrl+Enter 格式化
        jsonInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                formatJSON();
            }
        });

        // 图片base64粘贴后自动刷新预览
        imageBase64El.addEventListener('paste', function() {
            setTimeout(renderPreview, 100);
        });

        // 二维码输入实时生成
        qrcodeInput.addEventListener('input', function() {
            setTimeout(generateQRCode, 100);
        });

        // 二维码粘贴后自动生成
        qrcodeInput.addEventListener('paste', function() {
            setTimeout(generateQRCode, 100);
        });

        // ===== 自动保存/恢复历史记录 =====
        const STORAGE_KEYS = {
            json: 'offline-tools-json-input',
            base64: 'offline-tools-base64-input',
            'image-base64': 'offline-tools-image-base64',
            url: 'offline-tools-url-input',
            qrcode: 'offline-tools-qrcode-input'
        };

        // 自动保存输入内容
        function setupAutoSave(inputElement, storageKey) {
            // 页面加载时恢复
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved) {
                    inputElement.value = saved;
                }
            } catch (e) {
                // 读取失败，忽略，使用空内容
                console.warn('读取历史记录失败:', e);
            }
            // 输入时自动保存
            inputElement.addEventListener('input', function() {
                try {
                    localStorage.setItem(storageKey, this.value);
                } catch (e) {
                    // 存储超出容量限制，清除旧数据尝试一次
                    console.warn('保存历史记录失败，容量已满:', e);
                    try {
                        localStorage.clear();
                        localStorage.setItem(storageKey, this.value);
                    } catch (e2) {
                        console.error('保存失败，无法写入本地存储:', e2);
                    }
                }
            });
        }

        // 为所有输入框设置自动保存
        setupAutoSave(jsonInput, STORAGE_KEYS.json);
        setupAutoSave(base64Input, STORAGE_KEYS.base64);
        setupAutoSave(imageBase64El, STORAGE_KEYS['image-base64']);
        setupAutoSave(urlInput, STORAGE_KEYS.url);
        setupAutoSave(qrcodeInput, STORAGE_KEYS.qrcode);

        // 切换功能时，如果有保存的内容，对应标签页打开后会自动显示
        // 图片Base64恢复内容后自动刷新预览
        if (imageBase64El.value) {
            setTimeout(renderPreview, 100);
        }

        // JSON恢复内容后自动格式化
        if (jsonInput.value.trim()) {
            setTimeout(formatJSON, 100);
        }

        // 二维码恢复内容后自动生成
        if (qrcodeInput.value.trim()) {
            setTimeout(generateQRCode, 100);
        }

        // 初始化
        updateActions('json');
    </script>
</body>
